name: Update Profile README

on:
  schedule:
    - cron: "0 0 * * *" # tiap hari jam 07:00 WIB
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil data dari GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api "users/$OWNER" > /tmp/user.json
          gh api "users/$OWNER/repos?sort=pushed&per_page=100" > /tmp/repos.json
          gh api graphql -F login="$OWNER" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }' > /tmp/contrib.json

      - name: Update README
        env:
          OWNER: ${{ github.repository_owner }}
          MAX_REPOS: "6" # jumlah repo yang ditampilkan
        run: |
          python3 - <<'EOF'
          import json, os, re

          owner = os.environ["OWNER"]
          limit = int(os.environ["MAX_REPOS"])
          user = json.load(open("/tmp/user.json"))
          repos = json.load(open("/tmp/repos.json"))
          cal = json.load(open("/tmp/contrib.json"))["data"]["user"][
              "contributionsCollection"]["contributionCalendar"]

          # Hitung streak (hari ini belum commit = streak masih dihitung dari kemarin)
          days = [d for w in cal["weeks"] for d in w["contributionDays"]]
          days.sort(key=lambda d: d["date"])
          if days and days[-1]["contributionCount"] == 0:
              days = days[:-1]
          streak = 0
          for d in reversed(days):
              if d["contributionCount"] == 0:
                  break
              streak += 1

          readme = open("README.md", encoding="utf-8").read()

          # Angka-angka di README
          readme = re.sub(r"PUBLIC_REPOS = \d+",
                          f'PUBLIC_REPOS = {user["public_repos"]}', readme)
          readme = re.sub(r"COMMUNITY   = \d+ followers",
                          f'COMMUNITY   = {user["followers"]} followers', readme)
          readme = re.sub(r"<code>\d+ contributions</code>",
                          f'<code>{cal["totalContributions"]} contributions</code>', readme)
          readme = re.sub(r"<code>\d+ day streak</code>",
                          f"<code>{streak} day streak</code>", readme)

          # Daftar project (format sama seperti aslinya)
          repos = [r for r in repos if r["name"].lower() != owner.lower()][:limit]
          lines = []
          for r in repos:
              line = f'- **[{r["name"]}]({r["html_url"]})**'
              if r["description"]:
                  line += f' — {r["description"].strip()}'
              line += f' · ⭐ {r["stargazers_count"]}'
              lines.append(line)
          block = "<!-- REPOS:START -->\n" + "\n".join(lines) + "\n<!-- REPOS:END -->"
          readme = re.sub(r"<!-- REPOS:START -->.*?<!-- REPOS:END -->",
                          lambda _: block, readme, flags=re.S)

          open("README.md", "w", encoding="utf-8").write(readme)
          EOF

      - name: Commit kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update profile stats" && git push)
